<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ESP32 BLE</title>

  <style>

    body{
      font-family: Arial;
      padding: 30px;
    }

    button{
      padding: 12px 20px;
      margin: 5px;
      font-size: 18px;
      cursor: pointer;
    }

    #status{
      font-size: 22px;
      margin-bottom: 20px;
      color: red;
    }

  </style>
</head>

<body>

  <h1>🎛️ ESP32 BLE Controller</h1>

  <div id="status">
    Status: Belum terhubung
  </div>

  <button id="btnConnect">
    🔌 Connect
  </button>

  <button id="btnOn" disabled>
    🔴 ON
  </button>

  <button id="btnOff" disabled>
    ⚫ OFF
  </button>

  <script>

    // =========================
    // UUID
    // =========================
    const SERVICE_UUID =
      "77EB7594-4E18-41A0-83AF-142732AA26F0";

    const RX_UUID =
      "77EB7594-4E18-41A0-83AF-142732AA26F2";

    // =========================
    // VARIABLE
    // =========================
    let device;
    let server;
    let service;
    let rxCharacteristic;

    // =========================
    // ELEMENT
    // =========================
    const btnConnect =
      document.getElementById("btnConnect");

    const btnOn =
      document.getElementById("btnOn");

    const btnOff =
      document.getElementById("btnOff");

    const statusText =
      document.getElementById("status");

    // =========================
    // CONNECT BLE
    // =========================
    async function connectBLE(){

      try{

        statusText.innerHTML =
          "Status: Menghubungkan...";

        device =
          await navigator.bluetooth.requestDevice({

            filters: [
              { namePrefix: "ESP32_LED_CIA" }
            ],

            optionalServices: [
              SERVICE_UUID
            ]
          });

        server =
          await device.gatt.connect();

        service =
          await server.getPrimaryService(
            SERVICE_UUID
          );

        rxCharacteristic =
          await service.getCharacteristic(
            RX_UUID
          );

        statusText.innerHTML =
          "Status: Terhubung ✅";

        statusText.style.color = "green";

        btnOn.disabled = false;
        btnOff.disabled = false;

        console.log("BLE CONNECTED");

      }
      catch(error){

        console.log(error);

        statusText.innerHTML =
          "Status: Gagal connect ❌";

        statusText.style.color = "red";
      }
    }

    // =========================
    // SEND COMMAND
    // =========================
    async function sendCommand(command){

      if(!rxCharacteristic){

        alert("Belum connect");

        return;
      }

      const encoder =
        new TextEncoder();

      await rxCharacteristic.writeValue(
        encoder.encode(command)
      );

      console.log(
        "Kirim:",
        command
      );
    }

    // =========================
    // BUTTON EVENT
    // =========================
    btnConnect.addEventListener(
      "click",
      connectBLE
    );

    btnOn.addEventListener(
      "click",
      () => sendCommand("on")
    );

    btnOff.addEventListener(
      "click",
      () => sendCommand("off")
    );

  </script>

</body>
</html>
