<!DOCTYPE html>
<html>
<head>
  <title>ESP32 BLE</title>

  <style>
    body {
      font-family: Arial;
      padding: 30px;
    }

    button {
      padding: 12px 20px;
      margin: 5px;
      font-size: 18px;
      cursor: pointer;
    }

    #status {
      margin-bottom: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .connected {
      color: green;
    }

    .disconnected {
      color: red;
    }
  </style>
</head>

<body>

  <h1>🎛️ ESP32 LED Controller</h1>

  <div id="status" class="disconnected">
    Status: Belum terhubung
  </div>

  <button id="btnConnect">
    🔌 Hubungkan ke ESP32
  </button>

  <button id="btnOn" disabled>
    🔴 ON
  </button>

  <button id="btnOff" disabled>
    ⚫ OFF
  </button>

  <script src="fungsi.js"></script>

</body>
</html>
